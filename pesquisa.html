    <div class="header-sub">Leva menos de 2 minutos · Suas respostas são confidenciais</div>

  <div class="progress-wrap" id="progressWrap">

      <span id="stepCount">0 / 15</span>

  <div class="input-area" id="inputArea"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMlYO-TWfIczliD-Iundc2AWW8cyRtBr2a3jTEaa_Z-ggeeH18cHaYu8t2YJV769LO/exec";

const answers = {};
let currentStep = 0;

const STEPS = [
  { key: "nome", msg: "👋 Olá! Sou o assistente da <strong>Jubarthi</strong>. Fico feliz em ter você aqui.<br><br>Vamos começar pelo seu nome completo:", type: "text", placeholder: "Seu nome completo" },
  { key: "especialidade", msg: (a) => `Prazer, <strong>${a.nome}</strong>! 😊<br><br>Qual é a sua especialidade médica? (Se não for médico, escreva sua função ou área)`, type: "text", placeholder: "Ex: Cardiologista, Dermatologista, Gestor..." },
  { key: "email", msg: "Perfeito! Agora me informe seu <strong>e-mail</strong> para contato:", type: "text", placeholder: "seuemail@exemplo.com" },
  { key: "whatsapp", msg: "E seu <strong>WhatsApp</strong> com DDD:", type: "text", placeholder: "(11) 99999-9999" },
  { key: "como_chegou", msg: "Ótimo! Agora vamos para as perguntas. São rápidas, prometo. 🙂<br><br>Como você chegou até a <strong>Jubarthi</strong>?", type: "options", options: ["Indicação de colega", "Redes sociais", "Google / pesquisa", "Evento ou congresso", "LinkedIn", "Outro"] },
  { key: "servico_prometido", msg: "O serviço contratado <strong>atendeu o que foi prometido</strong>?<br><span style='font-size:13px;color:#9AA3B2'>1 = Muito abaixo · 5 = Superou expectativas</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "qualidade_atendimento", msg: "Como você avalia a <strong>qualidade do atendimento</strong> da equipe Jubarthi?<br><span style='font-size:13px;color:#9AA3B2'>1 = Ruim · 5 = Excelente</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "facilidade_contato", msg: "Como foi a <strong>facilidade de contato e responsividade</strong> da equipe?<br><span style='font-size:13px;color:#9AA3B2'>1 = Muito difícil · 5 = Sempre disponível</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "clareza_relatorios", msg: "A <strong>clareza dos relatórios e informações</strong> entregues foi:<br><span style='font-size:13px;color:#9AA3B2'>1 = Confusa · 5 = Muito clara</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "cumprimento_prazos", msg: "Como avalia o <strong>cumprimento dos prazos</strong> acordados?<br><span style='font-size:13px;color:#9AA3B2'>1 = Sempre atrasado · 5 = Sempre no prazo</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "qualidade_servicos", msg: "A <strong>qualidade dos conteúdos e serviços entregues</strong> foi:<br><span style='font-size:13px;color:#9AA3B2'>1 = Ruim · 5 = Excelente</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "custo_beneficio", msg: "Como você avalia a <strong>relação custo-benefício</strong> dos serviços da Jubarthi?<br><span style='font-size:13px;color:#9AA3B2'>1 = Ruim · 5 = Excelente</span>", type: "scale", labels: ["1","2","3","4","5"] },
  { key: "nps", msg: "Numa escala de <strong>0 a 10</strong>, qual a probabilidade de você <strong>recomendar a Jubarthi</strong> para um colega médico?<br><span style='font-size:13px;color:#9AA3B2'>0 = Jamais recomendaria · 10 = Com certeza recomendaria</span>", type: "nps" },
  { key: "intencao_continuar", msg: "Você pretende <strong>continuar ou expandir</strong> os serviços com a Jubarthi?", type: "options", options: ["Sim, com certeza", "Provavelmente sim", "Ainda estou avaliando", "Provavelmente não"] },
  { key: "comentario", msg: "Última pergunta! 🎉<br><br>Quer deixar algum <strong>comentário, elogio ou sugestão</strong> para a nossa equipe? (opcional)", type: "textarea", placeholder: "Escreva aqui à vontade... (pode deixar em branco se preferir)", optional: true }
];

const TOTAL = STEPS.length;
const chat = document.getElementById("chat");
const inputArea = document.getElementById("inputArea");

function updateProgress(step) {
  const pct = Math.round((step / TOTAL) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("stepCount").textContent = step + " / " + TOTAL;
  document.getElementById("stepLabel").textContent =
    step === 0 ? "Vamos começar" : step < 4 ? "Cadastro" : step < 14 ? "Pesquisa de satisfação" : "Finalizando";
}

function addBotBubble(html, cb) {
  const typing = document.createElement("div");
  typing.className = "bubble-bot";
  typing.innerHTML = `<div class="avatar">🐋</div><div class="bot-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  chat.appendChild(typing);
  scrollChat();
  setTimeout(() => {
    typing.remove();
    const bubble = document.createElement("div");
    bubble.className = "bubble-bot";
    bubble.innerHTML = `<div class="avatar">🐋</div><div class="bot-text">${html}</div>`;
    chat.appendChild(bubble);
    scrollChat();
    if (cb) cb();
  }, 700 + Math.random() * 300);
}

function addUserBubble(text) {
  const b = document.createElement("div");
  b.className = "bubble-user";
  b.innerHTML = `<div class="user-text">${escHtml(text)}</div>`;
  chat.appendChild(b);
  scrollChat();
}

function scrollChat() {
  chat.scrollTop = chat.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
}

function escHtml(t) {
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function clearInput() { inputArea.innerHTML = ""; }

function renderInput(step) {
  const s = STEPS[step];
  clearInput();

  if (s.type === "text" || s.type === "textarea") {
    const wrap = document.createElement("div");
    wrap.className = "text-wrap";
    const inp = document.createElement(s.type === "textarea" ? "textarea" : "input");
    inp.className = "text-input";
    inp.placeholder = s.placeholder || "";
    inp.rows = s.type === "textarea" ? 3 : 1;
    const btn = document.createElement("button");
    btn.className = "send-btn";
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;
    const submit = () => {
      const val = inp.value.trim();
      if (!val && !s.optional) return;
      advance(s.key, val || "(sem comentário)");
    };
    btn.addEventListener("click", submit);
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
    wrap.appendChild(inp);
    wrap.appendChild(btn);
    inputArea.appendChild(wrap);
    setTimeout(() => inp.focus(), 100);

  } else if (s.type === "options") {
    const wrap = document.createElement("div");
    wrap.className = "options-wrap";
    s.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.addEventListener("click", () => advance(s.key, opt));
      wrap.appendChild(btn);
    });
    inputArea.appendChild(wrap);

  } else if (s.type === "scale") {
    const wrap = document.createElement("div");
    wrap.className = "scale-wrap";
    s.labels.forEach(lbl => {
      const btn = document.createElement("button");
      btn.className = "scale-btn";
      btn.textContent = lbl;
      btn.addEventListener("click", () => advance(s.key, lbl));
      wrap.appendChild(btn);
    });
    inputArea.appendChild(wrap);

  } else if (s.type === "nps") {
    const wrap = document.createElement("div");
    wrap.className = "nps-wrap";
    for (let i = 0; i <= 10; i++) {
      const btn = document.createElement("button");
      btn.className = "nps-btn";
      btn.textContent = i;
      if (i <= 6) btn.style.cssText = "border-color:#FFCDD2;color:#C62828;background:#FFF8F8";
      else if (i <= 8) btn.style.cssText = "border-color:#FFE0B2;color:#E65100;background:#FFFBF5";
      else btn.style.cssText = "border-color:#C8E6C9;color:#2E7D32;background:#F5FFF6";
      btn.addEventListener("click", () => advance(s.key, String(i)));
      wrap.appendChild(btn);
    }
    inputArea.appendChild(wrap);
  }
}

function advance(key, value) {
  answers[key] = value;
  addUserBubble(value);
  clearInput();
  currentStep++;
  updateProgress(currentStep);
  if (currentStep >= TOTAL) { sendData(); return; }
  const s = STEPS[currentStep];
  const msg = typeof s.msg === "function" ? s.msg(answers) : s.msg;
  addBotBubble(msg, () => renderInput(currentStep));
}

function start() {
  updateProgress(0);
  addBotBubble(STEPS[0].msg, () => renderInput(0));
}

function sendData() {
  document.getElementById("progressWrap").classList.add("hidden");
  clearInput();
  addBotBubble("Perfeito! Estamos registrando suas respostas... ⏳");
  setTimeout(() => {
    let done = false;
    const finish = () => { if (!done) { done = true; showSuccess(); } };
    const params = new URLSearchParams(answers).toString();
    const img = new Image();
    img.src = SCRIPT_URL + "?" + params;
    img.onload = finish;
    img.onerror = finish;
    setTimeout(finish, 3000);
  }, 1200);
}

function showSuccess() {
  document.getElementById("chat").classList.add("hidden");
  document.getElementById("inputArea").classList.add("hidden");
  const s = document.createElement("div");
  s.className = "success";
  s.innerHTML = `
    <div class="success-icon">✅</div>
    <div class="success-title">Obrigado pela sua avaliação!</div>
    <div class="success-sub">Suas respostas foram registradas com sucesso.<br>A equipe <strong>Jubarthi</strong> agradece sua confiança e continuará trabalhando para superar suas expectativas. 💙</div>
    <a href="https://www.instagram.com/jubarthi" target="_blank" class="ig-btn">

      Seguir a Jubarthi no Instagram
    </a>
  `;
  document.getElementById("card").appendChild(s);
}

start();
</script>
